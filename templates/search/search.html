<h3>
	Search
	<span class="htmx-indicator">
		Searching...
	</span>
</h3>
<input class="
w-full max-w-md px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 bg-white border border-gray-300 rounded-lg shadow-sm transition-all duration-200 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 disabled:bg-gray-50 disabled:text-gray-400
" type="search" name="search" placeholder="Begin Typing To Search..." hx-post="/search/get"
	hx-trigger="input changed delay:500ms, keyup[key=='Enter'], load" hx-target="#search-results"
	hx-indicator=".htmx-indicator">

<div id="search-results"></div>
